[project]
name = "multiagentlanggraphproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "taarunsharrma-design", email = "taarunsharrma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
multiagentlanggraphproject = "multiagentlanggraphproject:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
ui = [
    "streamlit>=1.66.1",
]
